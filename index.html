<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="T.I.D.E. — Things I Did Everyday">
  <title>T.I.D.E. — Things I Did Everyday</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <button id="mobile-close" class="icon-button mobile-only" aria-label="Close menu">×</button>
        <div class="brand-mark">T</div>
        <div>
          <div class="brand">T.I.D.E.</div>
          <div class="brand-sub">THINGS I DID EVERYDAY</div>
        </div>
      </div>

      <nav class="nav-stack" id="primary-nav">
        <button class="nav-item active" data-view="today"><span>◉</span><b>Today</b></button>
        <button class="nav-item" data-view="calendar"><span>▦</span><b>Calendar</b></button>
        <button class="nav-item" data-view="on-this-day"><span>↺</span><b>On This Day</b></button>
        <button class="nav-item" data-view="monthly"><span>◫</span><b>Monthly Review</b></button>
        <button class="nav-item" data-view="yearly"><span>◎</span><b>Year in Review</b></button>
        <button class="nav-item" data-view="trackers"><span>⌁</span><b>Trackers</b></button>
        <button class="nav-item" data-view="music"><span>♫</span><b>Music</b></button>
        <button class="nav-item" data-view="records"><span>◆</span><b>Personal Records</b></button>
        <button class="nav-item ask-nav" data-view="ask"><span>⌕</span><b>Ask T.I.D.E.</b></button>
        <button class="nav-item" data-view="history"><span>≡</span><b>History</b></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><span>⚙</span><b>Settings</b></button>
        <div class="sync-pill" id="sync-pill"><span class="sync-dot"></span><span>Local-first</span></div>
      </div>
    </aside>

    <div id="sidebar-scrim" class="sidebar-scrim"></div>

    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left">
          <button id="mobile-menu" class="icon-button desktop-hide" aria-label="Open menu">☰</button>
          <div id="view-eyebrow" class="eyebrow">TODAY</div>
        </div>
        <div class="topbar-right">
          <button id="quick-ask" class="top-action">⌕ Ask T.I.D.E.</button>
          <button id="jump-today" class="top-action">Today</button>
        </div>
      </header>

      <div id="view-root" class="view-root" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <dialog id="modal" class="modal">
    <div class="modal-head">
      <div>
        <div class="eyebrow" id="modal-eyebrow"></div>
        <h2 id="modal-title"></h2>
      </div>
      <button id="modal-close" class="icon-button" aria-label="Close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <script type="importmap">{"imports":{"./engine.js":"./engine-v3.js"}}</script>
  <script type="module" src="app.js"></script>
  <script type="module" src="enhancements.js"></script>
  <script type="module" src="platform-copy.js"></script>
</body>
</html>
