<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="T.I.D.E. — Things I Did Everyday">
  <title>T.I.D.E. — Things I Did Everyday</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="insights.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="stylesheet" href="date-jump.css">
  <link rel="stylesheet" href="midnight-royal.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <button id="mobile-close" class="icon-button mobile-only" aria-label="Close menu">×</button>
        <div class="brand-mark">T</div>
        <div>
          <div class="brand">T.I.D.E.</div>
          <div class="brand-sub">THINGS I DID EVERYDAY</div>
        </div>
      </div>

      <nav class="nav-stack" id="primary-nav">
        <button class="nav-item active" data-view="today"><span>◉</span><b>Today</b></button>
        <button class="nav-item" data-view="calendar"><span>▦</span><b>Calendar</b></button>
        <button class="nav-item" data-view="on-this-day"><span>↺</span><b>On This Day</b></button>
        <button class="nav-item" data-view="monthly"><span>◫</span><b>Monthly Review</b></button>
        <button class="nav-item" data-view="yearly"><span>◎</span><b>Year in Review</b></button>
        <button class="nav-item" data-view="year-rankings"><span>↕</span><b>Year Rankings</b></button>
        <button class="nav-item" data-view="trackers"><span>⌁</span><b>Trackers</b></button>
        <button class="nav-item" data-view="music"><span>♫</span><b>Music</b></button>
        <button class="nav-item" data-view="gaming"><span>🎮</span><b>Gaming</b></button>
        <button class="nav-item" data-view="finances"><span>◈</span><b>Finances</b></button>
        <button class="nav-item" data-view="health"><span>✧</span><b>Health</b></button>
        <button class="nav-item" data-view="records"><span>◆</span><b>Personal Records</b></button>
        <button class="nav-item ask-nav" data-view="ask"><span>⌕</span><b>Ask T.I.D.E.</b></button>
        <button class="nav-item" data-view="history"><span>≡</span><b>History</b></button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><span>⚙</span><b>Settings</b></button>
        <div class="sync-pill" id="sync-pill"><span class="sync-dot"></span><span>Local-first</span></div>
      </div>
    </aside>

    <div id="sidebar-scrim" class="sidebar-scrim"></div>

    <main class="main-area">
      <header class="topbar tide-topbar">
        <div class="topbar-left tide-topbar-context">
          <button id="mobile-menu" class="icon-button desktop-hide tide-topbar-menu" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <span class="tide-topbar-context-mark" aria-hidden="true">T</span>
          <div class="tide-topbar-location">
            <span class="tide-topbar-kicker">YOUR T.I.D.E.</span>
            <div id="view-eyebrow" class="eyebrow tide-topbar-current">TODAY</div>
          </div>
        </div>
        <nav class="topbar-right tide-topbar-actions" aria-label="Quick navigation">
          <button id="quick-ask" class="top-action tide-topbar-action tide-topbar-ask" type="button" aria-label="Open Ask T.I.D.E.">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m15.7 15.7 4.5 4.5"/><path d="M10.8 7.9v5.8M7.9 10.8h5.8" stroke-width="1.2"/></svg>
            <span class="tide-topbar-label-full">Ask T.I.D.E.</span><span class="tide-topbar-label-short" aria-hidden="true">Ask</span>
          </button>
          <button id="jump-today" class="top-action tide-topbar-action tide-topbar-today" type="button" aria-label="Go to today">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>
            <span>Today</span>
          </button>
        </nav>
      </header>

      <div id="view-root" class="view-root" aria-live="polite"></div>
    </main>
    <nav class="mobile-dock" id="mobile-dock" aria-label="Mobile quick navigation">
      <button type="button" data-mobile-view="today" class="is-active" aria-current="page" aria-label="Today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/></svg><span>Today</span>
      </button>
      <button type="button" data-mobile-view="calendar" aria-label="Calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M7.5 14h3m3.5 0h3"/></svg><span>Calendar</span>
      </button>
      <button type="button" data-mobile-view="monthly" aria-label="Monthly Review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Reviews</span>
      </button>
      <button type="button" data-mobile-view="trackers" aria-label="Trackers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V13h4v7M10 20V5h4v15M16 20v-9h4v9M3 20h18"/></svg><span>Trackers</span>
      </button>
      <button type="button" data-mobile-more aria-label="Open all pages and settings" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>More</span>
      </button>
    </nav>
  </div>

  <input id="tide-private-activation-file" type="file" accept=".json,application/json" hidden aria-label="Activate T.I.D.E. Health and Finances">

  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <dialog id="modal" class="modal">
    <div class="modal-head">
      <div>
        <div class="eyebrow" id="modal-eyebrow"></div>
        <h2 id="modal-title"></h2>
      </div>
      <button id="modal-close" class="icon-button" aria-label="Close">×</button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <script type="importmap">{"imports":{"./engine.js":"./engine-v4.js"}}</script>
  <script type="module">
    import { ensureBundledHistory } from './history-bootstrap.js';
    await ensureBundledHistory();
    await import('./app.js');
    await import('./date-jump.js');
    await import('./voice-dictation.js');
    await import('./year-rankings.js');
    await import('./shared-save.js');
    await import('./enhancements.js');
    await import('./migraine-fix.js');
    await import('./tracker-upgrades.js');
    await import('./gaming.js');
    await import('./platform-copy.js');
    await import('./shortcut-resume-sync.js');
  </script>
</body>
</html>
